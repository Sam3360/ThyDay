<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Countdown</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
      overflow: hidden;
      color: white;
      padding: 20px;
    }

    .glass {
      width: min(900px, 95%);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      padding: 40px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 4rem);
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    p {
      opacity: 0.9;
      margin-bottom: 24px;
      font-size: 1.05rem;
    }

    .password-screen {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    input {
      width: min(320px, 90%);
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.1);
      color: white;
      outline: none;
      font-size: 1rem;
      text-align: center;
    }

    input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    button {
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.22);
    }

    .hidden {
      display: none;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .time-box {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 22px;
      padding: 24px 12px;
      transition: 0.3s ease;
    }

    .time-box:hover {
      transform: scale(1.04);
    }

    .number {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
    }

    .label {
      margin-top: 8px;
      font-size: 0.95rem;
      opacity: 0.85;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .birthday-message {
      font-size: clamp(2rem, 5vw, 4.5rem);
      font-weight: 800;
      line-height: 1.2;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px rgba(255,255,255,0.4); }
      to { text-shadow: 0 0 28px rgba(255,255,255,0.9); }
    }

    .error {
      color: #ffd6d6;
      font-size: 0.95rem;
      min-height: 20px;
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 16px;
      opacity: 0.9;
      animation: fall linear forwards;
      z-index: 1;
    }

    @keyframes heartPop {
      0% {
        transform: translate(-50%, -50%) scale(0.2);
        opacity: 0;
      }
      30% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 1;
      }
      60% {
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.2);
        opacity: 0;
      }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>
<body>
  <div class="glass">
    <div id="passwordScreen" class="password-screen">
      <h1>Private Access</h1>
      <p>Enter password to open the countdown</p>
      <input type="password" id="passwordInput" placeholder="Enter Password" />
      <button onclick="checkPassword()">Unlock</button>
      <div class="error" id="error"></div>
    </div>

    <div id="mainContent" class="hidden">
      <h1 id="title">Countdown to 13 May 2026</h1>
      <p id="subtitle">A special day is getting closer ✨</p>

      <div id="countdownSection">
        <div class="countdown-grid">
          <div class="time-box">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
          </div>
          <div class="time-box">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
          </div>
          <div class="time-box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
          </div>
          <div class="time-box">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
          </div>
        </div>
      </div>

      <div id="birthdaySection" class="hidden">
        <div class="birthday-message">
          Happy Birthday<br />Samaira 🎉
        </div>
      </div>
    </div>
  </div>

  <script>
    const correctPassword = "130512";
    const targetDate = new Date("2026-05-13T00:00:00");
    const birthdayEnd = new Date("2026-05-14T00:00:00");

    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const error = document.getElementById("error");

      if (input === correctPassword) {
        showHeartAnimation();
        document.getElementById("passwordScreen").classList.add("hidden");
        document.getElementById("mainContent").classList.remove("hidden");
        startCountdown();
      } else {
        error.textContent = "Wrong password. Try again.";
      }
    }

    function showHeartAnimation() {
      const heart = document.createElement("div");
      heart.innerHTML = "❤";
      heart.style.position = "fixed";
      heart.style.top = "50%";
      heart.style.left = "50%";
      heart.style.transform = "translate(-50%, -50%) scale(0.2)";
      heart.style.fontSize = "120px";
      heart.style.zIndex = "9999";
      heart.style.pointerEvents = "none";
      heart.style.textShadow = "0 0 25px rgba(255,255,255,0.8)";
      heart.style.animation = "heartPop 1.4s ease forwards";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 1500);
    }

    function createConfetti() {
      for (let i = 0; i < 120; i++) {
        const piece = document.createElement("div");
        piece.classList.add("confetti");
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.animationDuration = (Math.random() * 3 + 3) + "s";
        piece.style.animationDelay = Math.random() * 2 + "s";
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        piece.style.background = `hsl(${Math.random() * 360}, 90%, 70%)`;
        document.body.appendChild(piece);
      }
    }

    function showBirthdayMode() {
      document.getElementById("countdownSection").classList.add("hidden");
      document.getElementById("birthdaySection").classList.remove("hidden");
      document.getElementById("title").textContent = "13 May 2026";
      document.getElementById("subtitle").textContent = "The special day is here ✨";
      createConfetti();
    }

    function startCountdown() {
      function updateCountdown() {
        const now = new Date();

        if (now >= targetDate && now < birthdayEnd) {
          showBirthdayMode();
          clearInterval(timer);
          return;
        }

        if (now >= birthdayEnd) {
          document.getElementById("title").textContent = "The day has passed 💫";
          document.getElementById("subtitle").textContent = "But memories stay forever.";
        }

        const distance = targetDate - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((distance / (1000 * 60)) % 60);
        const seconds = Math.floor((distance / 1000) % 60);

        document.getElementById("days").textContent = Math.max(days, 0);
        document.getElementById("hours").textContent = Math.max(hours, 0);
        document.getElementById("minutes").textContent = Math.max(minutes, 0);
        document.getElementById("seconds").textContent = Math.max(seconds, 0);
      }

      updateCountdown();
      const timer = setInterval(updateCountdown, 1000);
    }

    document.getElementById("passwordInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") checkPassword();
    });
  </script>
</body>
</html>
